name: Salesforce Data Export to Google Drive

on:
  schedule:
    - cron: "0 7 * * 2"  # Default: Monday 11 PM PST (Tue 7 AM UTC) — adjust to your timezone
  workflow_dispatch:
    inputs:
      retry_count:
        description: "Auto-retry attempt number (0 = first run)"
        required: false
        default: "0"

permissions:
  issues: write
  contents: read
  actions: write

jobs:
  export:
    name: Download Salesforce exports to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show attempt number
        run: |
          RETRY="${{ github.event.inputs.retry_count || '0' }}"
          echo "This is attempt number: $((RETRY + 1)) of 3"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h

      - name: Run export
        id: run_export
        env:
          SF_CLIENT_ID:                ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET:            ${{ secrets.SF_CLIENT_SECRET }}
          SF_REFRESH_TOKEN:            ${{ secrets.SF_REFRESH_TOKEN }}
          SF_ORG_DOMAIN:               ${{ vars.SF_ORG_DOMAIN }}
          GDRIVE_FOLDER_ID:            ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          WAIT_BETWEEN_DOWNLOADS:      ${{ vars.WAIT_BETWEEN_DOWNLOADS || '30' }}
          DRIVE_TYPE:                  ${{ vars.DRIVE_TYPE || 'personal' }}
          HEADLESS:                    "true"
        run: |
          python export_ui.py 2>&1 | tee /tmp/export_run.log
          EXIT=${PIPESTATUS[0]}
          echo "EXPORT_EXIT=$EXIT" >> $GITHUB_ENV
          exit $EXIT

      - name: Parse run results
        id: parse
        if: always()
        run: |
          python3 - << 'PYEOF'
          import re, os

          try:
              log = open("/tmp/export_run.log").read()
          except:
              log = ""

          m = re.search(r"OK:\s*(\d+)\s+Skipped:\s*(\d+)\s+Failed:\s*(\d+)", log)
          ok      = m.group(1) if m else "0"
          skipped = m.group(2) if m else "0"
          failed  = m.group(3) if m else "0"

          failed_details = re.findall(r"FAILED: (WE_\S+?) -- (.+)", log)
          if failed_details:
              failed_list   = "\n".join([f"- `{f}`" for f, _ in failed_details])
              failed_errors = "\n".join([f"- `{f}`: {e}" for f, e in failed_details])
          else:
              failed_list   = "- (none)"
              failed_errors = "- (none)"

          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"EXPORT_OK={ok}\n")
              fh.write(f"EXPORT_SKIPPED={skipped}\n")
              fh.write(f"EXPORT_FAILED={failed}\n")
              fh.write(f"FAILED_LIST<<EOF\n{failed_list}\nEOF\n")
              fh.write(f"FAILED_ERRORS<<EOF\n{failed_errors}\nEOF\n")
          PYEOF

      # ── SUCCESS ─────────────────────────────────────────────────────────────
      - name: Notify success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const attempt  = parseInt("${{ github.event.inputs.retry_count || '0' }}") + 1;
            const runUrl   = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const ok       = "${{ env.EXPORT_OK }}";
            const skipped  = "${{ env.EXPORT_SKIPPED }}";
            const failed   = "${{ env.EXPORT_FAILED }}";
            const { owner, repo } = context.repo;
            const today    = new Date().toISOString().slice(0, 10);

            const body = [
              `## ✅ Salesforce Export Completed Successfully`,
              ``,
              `**Date:** ${today}`,
              `**Attempt:** ${attempt} of 3`,
              `**Run:** ${runUrl}`,
              ``,
              `### Results`,
              `| Status | Count |`,
              `|---|---|`,
              `| ✅ Uploaded to Drive | ${ok} files |`,
              `| ⏭ Already in Drive (skipped) | ${skipped} files |`,
              `| ❌ Failed | ${failed} files |`,
              ``,
              attempt > 1
                ? `> This was a **retry run** (attempt ${attempt}). All remaining files have now been uploaded.`
                : `> All files uploaded in a single run. No retries needed.`,
            ].join("\n");

            await github.rest.issues.create({
              owner, repo,
              title: `✅ Export SUCCESS — ${ok} files uploaded — ${today}`,
              body,
              labels: ["export-success"],
            });

      # ── FAILURE + AUTO-RETRY ────────────────────────────────────────────────
      - name: Notify failure and auto-retry
        if: failure() && steps.run_export.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const retryCount   = parseInt("${{ github.event.inputs.retry_count || '0' }}");
            const maxRetries   = 2;
            const attemptNum   = retryCount + 1;
            const runUrl       = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const ok           = "${{ env.EXPORT_OK }}";
            const skipped      = "${{ env.EXPORT_SKIPPED }}";
            const failed       = "${{ env.EXPORT_FAILED }}";
            const failedList   = `${{ env.FAILED_LIST }}`;
            const failedErrors = `${{ env.FAILED_ERRORS }}`;
            const today        = new Date().toISOString().slice(0, 10);
            const { owner, repo } = context.repo;
            const waitMinutes  = 2;

            if (retryCount < maxRetries) {
              const nextRetry = retryCount + 1;

              const body = [
                `## ⚠️ Salesforce Export — Attempt ${attemptNum} of ${maxRetries + 1} Failed`,
                ``,
                `**Date:** ${today}`,
                `**Run:** ${runUrl}`,
                ``,
                `### This Run's Results`,
                `| Status | Count |`,
                `|---|---|`,
                `| ✅ Successfully uploaded | ${ok} files |`,
                `| ⏭ Already in Drive (skipped) | ${skipped} files |`,
                `| ❌ Failed to upload | ${failed} files |`,
                ``,
                `### Files That Were NOT Copied`,
                failedList,
                ``,
                `### Error Details`,
                failedErrors,
                ``,
                `---`,
                `### 🔄 What Happens Next`,
                `A **retry (attempt ${nextRetry + 1} of ${maxRetries + 1})** will automatically start in **${waitMinutes} minutes**.`,
                ``,
                `The retry will:`,
                `- Skip the **${ok} files already uploaded** to Drive`,
                `- Re-attempt the **${failed} failed files** only`,
                ``,
                `You will receive another notification when the retry completes.`,
              ].join("\n");

              const issue = await github.rest.issues.create({
                owner, repo,
                title: `⚠️ Export attempt ${attemptNum}/${maxRetries + 1} failed — retry starting in ${waitMinutes} min — ${today}`,
                body,
                labels: ["export-failure", "auto-retry"],
              });

              console.log(`Waiting ${waitMinutes} minutes before triggering retry...`);
              await new Promise(r => setTimeout(r, waitMinutes * 60 * 1000));

              await github.request("POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches", {
                owner, repo,
                workflow_id: "sf_ui_export.yml",
                ref: "main",
                inputs: { retry_count: String(nextRetry) },
                headers: { "X-GitHub-Api-Version": "2022-11-28" },
              });

              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issue.data.number,
                body: [
                  `### 🔄 Retry ${nextRetry} of ${maxRetries} Triggered`,
                  ``,
                  `Started at: **${new Date().toISOString()}**`,
                  ``,
                  `The retry is now running. You will receive a new notification (✅ success or ⚠️ failure) when it completes.`,
                ].join("\n"),
              });

            } else {
              const body = [
                `## ❌ Salesforce Export — ALL ${maxRetries + 1} ATTEMPTS FAILED`,
                ``,
                `**Date:** ${today}`,
                `**Last failed run:** ${runUrl}`,
                ``,
                `### ⚠️ Manual Action Required`,
                `All automatic retries have been exhausted. The following files were **NOT copied to Google Drive**:`,
                ``,
                failedList,
                ``,
                `### Error Details`,
                failedErrors,
                ``,
                `### Final Tally`,
                `| Status | Count |`,
                `|---|---|`,
                `| ✅ Successfully uploaded across all attempts | ${ok} files |`,
                `| ⏭ Already in Drive (skipped) | ${skipped} files |`,
                `| ❌ Still failed after ${maxRetries + 1} attempts | ${failed} files |`,
                ``,
                `---`,
                `### Next Steps`,
                `1. Review the error details above`,
                `2. Fix the underlying issue (disk space, network, Salesforce session)`,
                `3. Trigger the workflow manually — it will skip already-uploaded files and only retry the failed ones`,
                `   → [Run workflow manually](${{ github.server_url }}/${{ github.repository }}/actions/workflows/sf_ui_export.yml)`,
              ].join("\n");

              await github.rest.issues.create({
                owner, repo,
                title: `❌ Export FAILED after all ${maxRetries + 1} attempts — MANUAL ACTION REQUIRED — ${today}`,
                body,
                labels: ["export-failure", "manual-required"],
              });
            }
